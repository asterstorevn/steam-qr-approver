name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -eo pipefail
          xcodebuild \
            -project SteamQRApprover.xcodeproj \
            -scheme SteamQRApprover \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .ipa
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr SteamQRApprover.ipa Payload
          ls -lh SteamQRApprover.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamQRApprover-ipa
          path: SteamQRApprover.ipa
          if-no-files-found: error
